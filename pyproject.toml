[project]
name = "openfix"
version = "0.1.0"
description = "Industrial maintenance evidence-chain agent for grounded diagnosis and human-approved work orders."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "OpenFix Contributors" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Manufacturing",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py310"
