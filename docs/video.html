<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="OpenFix 工业设备检修证据链智能体参赛演示视频">
    <title>OpenFix · 赛道一演示视频</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #101914;
        --lime: #c9f36a;
        --muted: #9eaaa2;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 32px 20px 48px;
        background:
          radial-gradient(circle at 85% 5%, rgba(201, 243, 106, 0.14), transparent 34%),
          linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          var(--ink);
        background-size: auto, 64px 64px, 64px 64px, auto;
        color: #fff;
        font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
      }

      main {
        width: min(1180px, 100%);
        margin: 0 auto;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--lime);
        font: 18px Consolas, monospace;
        letter-spacing: 0.04em;
      }

      .mark {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        background:
          linear-gradient(var(--ink), var(--ink)) 8px 9px / 18px 3px no-repeat,
          linear-gradient(var(--ink), var(--ink)) 8px 16px / 13px 3px no-repeat,
          linear-gradient(var(--ink), var(--ink)) 8px 23px / 8px 3px no-repeat,
          var(--lime);
      }

      .eyebrow {
        display: inline-block;
        margin: 52px 0 18px;
        padding: 7px 12px;
        border: 1px solid rgba(201, 243, 106, 0.38);
        border-radius: 999px;
        color: var(--lime);
        font: 12px Consolas, monospace;
      }

      h1 {
        max-width: 940px;
        margin: 0;
        font-size: clamp(36px, 6vw, 72px);
        line-height: 1.08;
        letter-spacing: -0.055em;
      }

      .lead {
        max-width: 820px;
        margin: 22px 0 32px;
        color: var(--muted);
        font-size: 17px;
        line-height: 1.75;
      }

      .player {
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 22px;
        background: #060a07;
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.38);
      }

      video {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #000;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 16px;
        padding: 20px 22px;
        color: var(--muted);
        font-size: 13px;
      }

      .meta strong {
        display: block;
        margin-bottom: 3px;
        color: #fff;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 22px;
      }

      .button {
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 11px;
        padding: 10px 16px;
        color: #fff;
        text-decoration: none;
      }

      .button--primary {
        border-color: var(--lime);
        background: var(--lime);
        color: var(--ink);
        font-weight: 700;
      }

      footer {
        margin-top: 28px;
        color: #738079;
        font-size: 12px;
      }

      @media (max-width: 620px) {
        body {
          padding: 20px 12px 36px;
        }

        .eyebrow {
          margin-top: 36px;
        }

        .player {
          border-radius: 14px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand"><span class="mark" aria-hidden="true"></span> OpenFix · EVIDENCE AGENT</div>
      <span class="eyebrow">2026 开源行业解决方案创新赛 · 赛道一</span>
      <h1>工业设备检修证据链智能体</h1>
      <p class="lead">让每一次检修都有证据，让每一次危险操作都有门槛。演示包含正常诊断、证据链、人工审批、高危拦截、主动拒答与可复现评测。</p>
      <section class="player" aria-label="OpenFix 演示视频">
        <video controls preload="metadata" playsinline poster="video-poster.jpg">
          <source src="https://github.com/Kong-0626/openfix/releases/download/v0.1.0/OpenFix-.mp4" type="video/mp4">
          您的浏览器不支持视频播放。
        </video>
        <div class="meta">
          <span><strong>03:59</strong>1920 × 1080 · 30fps</span>
          <span><strong>内容范围</strong>诊断 · 安全 · 审批 · 评测</span>
        </div>
      </section>
      <div class="actions">
        <a class="button button--primary" href="https://github.com/Kong-0626/openfix">查看开源代码</a>
        <a class="button" href="https://github.com/Kong-0626/openfix/releases/download/v0.1.0/OpenFix-.mp4">下载 MP4</a>
      </div>
      <footer>演示数据均为合成数据，不替代设备厂商规程、授权人员判断或现场安全评估。</footer>
    </main>
  </body>
</html>
